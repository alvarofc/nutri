<!doctype html>
<!--
  Source for public/images/social-card.jpg (1200x630).
  Render (needs `npm install` for the fonts):
    chrome --headless=new --hide-scrollbars --allow-file-access-from-files \
      --force-device-scale-factor=1 --window-size=1200,630 \
      --screenshot=card.png file://$PWD/design/social-card.html
  then export card.png as a JPG (sips -s format jpeg -s formatOptions 90).
-->
<html lang="es">
<head>
<meta charset="utf-8" />
<style>
  @font-face { font-family: Halant; font-weight: 500; src: url('../node_modules/@fontsource/halant/files/halant-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: Montserrat; font-weight: 500; src: url('../node_modules/@fontsource/montserrat/files/montserrat-latin-500-normal.woff2') format('woff2'); }
  @font-face { font-family: Montserrat; font-weight: 400; src: url('../node_modules/@fontsource/montserrat/files/montserrat-latin-400-normal.woff2') format('woff2'); }

  :root {
    --cream: #faf9f7; --black: #1a1a1a; --accent: #2E2367;
    --blush: #e8d5d5; --rose: #c9a9a9; --muted: #8a8a8a;
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    position: relative; overflow: hidden; background: var(--cream);
    font-family: Montserrat, sans-serif; color: var(--black);
  }

  /* soft light, as on the site's hero */
  .glow { position: absolute; border-radius: 50%; filter: blur(70px); }
  .glow.a { width: 520px; height: 520px; right: -120px; top: -160px; background: var(--blush); opacity: .9; }
  .glow.b { width: 380px; height: 380px; left: -140px; bottom: -200px; background: var(--accent); opacity: .12; }

  .copy { position: absolute; left: 80px; top: 68px; bottom: 68px; width: 620px; display: flex; flex-direction: column; justify-content: space-between; }

  .wordmark { display: flex; flex-direction: column; gap: 2px; }
  .wordmark b { font: 500 40px/1 Halant, serif; letter-spacing: -.025em; color: var(--accent); }
  .wordmark span { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }

  h1 { font: 500 74px/1.06 Halant, serif; letter-spacing: -.025em; }
  h1 span { display: block; white-space: nowrap; }
  h1 .k { color: var(--black); } h1 .p { color: var(--accent); } h1 .r { color: var(--rose); }

  .meta { display: flex; align-items: center; gap: 18px; font-size: 18px; color: var(--muted); }
  .meta i { width: 28px; height: 1px; background: var(--rose); }
  .meta strong { font-weight: 500; color: var(--accent); }

  .photo { position: absolute; right: 80px; top: 65px; width: 400px; height: 500px; border-radius: 24px; overflow: hidden; background: var(--blush); box-shadow: 0 30px 60px -24px rgba(46,35,103,.35); }
  .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 18%; display: block; }

  .badge { position: absolute; right: 340px; bottom: 100px; display: flex; align-items: center; gap: 14px; padding: 16px 22px 16px 16px; background: #fff; border-radius: 20px; box-shadow: 0 18px 40px -12px rgba(26,26,26,.22); }
  .badge .ic { width: 44px; height: 44px; border-radius: 50%; background: rgba(46,35,103,.1); display: grid; place-items: center; }
  .badge p { font-size: 17px; font-weight: 500; line-height: 1.2; }
  .badge small { display: block; font-size: 13px; font-weight: 400; color: var(--muted); }
</style>
</head>
<body>
  <div class="glow a"></div><div class="glow b"></div>

  <div class="copy">
    <div class="wordmark"><b>Alexandra</b><span>Nutricionista</span></div>
    <h1><span class="k">Smart</span><span class="p">Anti-inflammatory</span><span class="r">Nutrition</span></h1>
    <div class="meta"><span>Madrid · Online</span><i></i><strong>alexandranutri.com</strong></div>
  </div>

  <div class="photo"><img src="../public/assets/alex-front.webp" alt="" /></div>

  <div class="badge">
    <div class="ic">
      <svg width="22" height="22" fill="none" stroke="#2E2367" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
    </div>
    <p>MAD01541<small>Colegiada</small></p>
  </div>
</body>
</html>
